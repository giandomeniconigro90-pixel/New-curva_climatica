name: climasense
description: App per l'ottimizzazione automatica della curva climatica Pompa di Calore.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # GRAFICI
  fl_chart: ^0.69.0

  # DATABASE
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # FILE SYSTEM
  path_provider: ^2.1.4
  file_picker: ^8.1.3
  share_plus: ^10.0.3

  # PDF EXPORT
  pdf: ^3.11.1
  printing: ^5.13.3

  # METEO GPS
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2

  # ✅ NOTIFICHE COMPLETE
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # UTILITY
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
