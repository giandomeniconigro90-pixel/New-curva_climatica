name: climasense
description: App per l'ottimizzazione della curva climatica.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- CORE ---
  cupertino_icons: ^1.0.2

  # --- DATABASE & STORAGE ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # --- UI & GRAFICI ---
  fl_chart: ^0.66.0
  intl: ^0.19.0

  # --- EXPORT ---
  pdf: ^3.10.4
  printing: ^5.11.0

  # --- METEO AUTOMATICO ---
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  http: ^1.2.0

  # --- NOTIFICHE (Versione con fix per Android SDK recenti) ---
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # --- CODE GENERATION ---
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # --- ASSETS ---
  assets:
    - assets/images/logo.png
